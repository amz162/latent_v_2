name: Intraday snapshot poll

# Task 107 v2 — delayed-snapshot polling during the feed availability window
# (09:45-15:45 PKT = 04:45-10:45 UTC). Polls every 15 minutes (GitHub Actions
# floor for meaningful cadence; the engine itself defaults to 120s when run on
# an always-on host — see task107_polling_configuration.json). Holidays are
# data-decided: no changed quotes -> no-op run.

on:
  schedule:
    - cron: "*/15 4-10 * * 1-5"
  workflow_dispatch:

concurrency:
  group: intraday-snapshot-poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poll delayed snapshots (idempotent, price-change detected)
        run: |
          test -f data/external_imports/psx_eod/task107_snapshots.db || sqlite3 data/external_imports/psx_eod/task107_snapshots.db "SELECT 1;" 2>/dev/null || true
          python3 scripts/task107_monitor.py || exit 0   # engine exits 0; provider failures are recorded, not silent
      - name: Commit snapshot store + monitor state
        run: |
          git config user.name "latent-poll-bot"
          git config user.email "poll@users.noreply.github.com"
          git add data/external_imports/psx_eod/task107_snapshots.db data/backtest_reports/task107/ops data/backtest_reports/task107/task107_*.json data/backtest_reports/task107/task107_*.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Intraday snapshot poll $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
